  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#070C17;--bg2:#0B1220;--gold:#C8A94A;--gold-lt:#E2C876;
      --white:#FFFFFF;--text:#EDF0F7;--muted:#8895AD;--border:rgba(200,169,74,.15);--max:900px;
    }
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.7;}
    h1,h2,h3{font-family:'Playfair Display',serif;}
    .container{max-width:var(--max);margin:0 auto;padding:0 1.5rem;}
    a{color:var(--gold);text-decoration:none;}
    nav{padding:1.25rem 0;border-bottom:1px solid var(--border);}
    .nav-inner{max-width:1160px;margin:0 auto;padding:0 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;}
    .logo{font-family:'Playfair Display',serif;font-weight:700;font-size:1.3rem;color:var(--text);}
    .logo span{color:var(--gold);}
    .nav-links{display:flex;gap:1.25rem;flex-wrap:wrap;}
    .nav-links a{font-size:.88rem;color:var(--muted);}
    .nav-links a:hover{color:var(--gold);}
    .page-header{text-align:center;padding:3.5rem 0 2rem;}
    .page-header h1{font-size:2.2rem;margin-bottom:.75rem;}
    .page-header p{color:var(--muted);max-width:600px;margin:0 auto;}
    .contact-options{display:flex;justify-content:center;gap:1rem;margin:2rem 0 3rem;flex-wrap:wrap;}
    .btn{display:inline-block;padding:.85rem 1.75rem;border-radius:8px;font-weight:600;font-size:.95rem;}
    .btn-gold{background:var(--gold);color:#070C17;}
    .btn-outline{border:1px solid var(--border);color:var(--text);}
    .form-wrap{background:#0D1526;border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:4rem;min-height:780px;}
    .form-wrap iframe{width:100%;height:745px;border:none;border-radius:8px;}
    .direct-info{text-align:center;color:var(--muted);font-size:.9rem;padding-bottom:3rem;}
    .direct-info a{color:var(--gold);}
    footer{border-top:1px solid var(--border);padding:2rem 0;text-align:center;color:var(--muted);font-size:.85rem;}
  </style>
